name: Publish to Instagram

# Manual only: runs when someone presses "Run workflow" (or a dispatch call)
# after Ted has approved the post. Never runs on push or on a schedule.
on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Folder under public/ig/ (e.g. 20261103-about)'
        required: true
      dry_run:
        description: 'Only print what would be posted'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST: ${{ inputs.post }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/ig-publish.mjs
